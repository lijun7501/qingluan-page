name: deploy-page

on:
  push:
    paths:
      - '.deploy/trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch page
        run: curl -fsSL "https://aka.doubaocdn.com/s/qCqwxKukxR" -o index.html
      - name: Commit page
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "no change"; else git commit -m "deploy: page v2.9.27 compliance wording"; git push; fi
