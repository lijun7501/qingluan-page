name: remove-site
on:
  push:
    paths:
      - '.github/workflows/remove-site.yml'
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete published site files
        run: |
          git config user.name 'site-remover'
          git config user.email 'site-remover@users.noreply.github.com'
          git rm -f index.html || true
          git rm -f CNAME || true
          git rm -f .github/workflows/deploy-page.yml || true
          git rm -f .deploy/trigger || true
          git commit -m 'chore: remove published site' || true
          git push
